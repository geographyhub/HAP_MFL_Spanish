<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C0A10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HAP Spanish">
<title>Spanish · Years 7 to 11 · Harris Academy Peckham</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#5C0A10;--main:#A3121C;--pale:#FBE9E5;--line:#F0D4CC;--accent:#F4B740;--gold:#F4B740;--ink:#1B2A3A;--ink2:#4A5563;--paper:#FAF8F4;--good:#2E7D32;--bad:#B3261E}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:20px;line-height:1.45;padding-bottom:84px}
a{color:var(--main);font-weight:700}
header{background:var(--deep);color:#fff;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.mast{max-width:1000px;margin:0 auto;padding:24px 20px 20px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.eyebrow{font-family:'Archivo',Arial,sans-serif;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75);font-size:15px}
h1{font-family:'Archivo','Arial Black',Arial,sans-serif;font-weight:900;font-size:clamp(42px,9vw,72px);line-height:1;margin:8px 0 6px}
h1 span{color:var(--gold)}
.sub{font-size:clamp(19px,2.6vw,22px);color:rgba(255,255,255,.88)}
.logo{background:#fff;border-radius:12px;padding:8px 12px;flex:none}.logo img{display:block;height:46px;width:auto}
.years{max-width:1000px;margin:0 auto;padding:0 20px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.years .lab{font-weight:800;font-size:18px;color:rgba(255,255,255,.8);margin-right:4px}
.years button{font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:20px;min-width:58px;padding:10px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.years button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--deep)}
nav.tabs{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .in{max-width:1000px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap}
nav.tabs button{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:18px;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:9px 16px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--main);border-color:var(--main);color:#fff}
@media(max-width:560px){nav.tabs .in{gap:6px;padding:8px 10px}nav.tabs button{font-size:16px;padding:7px 11px}.mast{flex-direction:column-reverse;padding:16px 16px 12px}.mast .logo img{height:38px}.years{padding:0 16px 14px;flex-wrap:nowrap;gap:8px}.years .lab{display:none}.years button{flex:1;min-width:0;padding:9px 4px}}
main{max-width:1000px;margin:0 auto;padding:22px 20px 40px}
h2{font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:clamp(28px,5vw,38px);color:var(--deep);margin:32px 0 12px;line-height:1.1}
h3{font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:24px;color:var(--deep);margin:22px 0 8px}
.tag{display:inline-block;background:var(--main);color:#fff;font-weight:800;border-radius:999px;padding:6px 16px;font-size:16px;letter-spacing:.06em}
.lead{font-size:20px;margin-bottom:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.facts{grid-template-columns:1fr 1fr}}@media(max-width:480px){.facts{grid-template-columns:1fr}}
.fact{background:var(--pale);border-radius:18px;padding:16px 18px}
.fact b{display:block;font-family:'Archivo',Arial,sans-serif;font-weight:900;font-size:30px;color:var(--main);line-height:1.1;margin-bottom:4px}
.note{background:#FFF6DF;border-left:6px solid #E8A33D;border-radius:12px;padding:14px 18px;margin:16px 0;font-size:20px}
.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:700px){.blocks{grid-template-columns:1fr}}
.blk{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px}
.blk h3{margin:0 0 6px}.blk ul{padding-left:24px}.blk li{margin:5px 0}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:14px 16px 14px 72px;background:#fff;border:2px solid var(--line);border-radius:16px;margin-bottom:10px}
ol.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:44px;height:44px;border-radius:12px;background:var(--main);color:#fff;font:900 22px 'Archivo',Arial,sans-serif;display:flex;align-items:center;justify-content:center}
ol.steps.top li::before{background:#E8A33D}
.links li{margin:8px 0}.links{padding-left:24px}
.tblw{overflow-x:auto;margin:10px 0 16px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:19px}
th{background:var(--main);color:#fff;text-align:left;padding:11px 14px}td{padding:11px 14px;border-top:2px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--paper)}
@media(max-width:560px){table.stk thead{display:none}table.stk,table.stk tbody,table.stk tr,table.stk td{display:block;width:100%}table.stk tr{border-top:3px solid var(--main);padding:6px 0}table.stk td{border-top:none;padding:5px 14px}table.stk td:empty{display:none}table.stk td[data-label]:not([data-label=""])::before{content:attr(data-label);display:block;font-size:15px;font-weight:800;color:var(--main);text-transform:uppercase;letter-spacing:.04em}tr:nth-child(even) td{background:#fff}}
.soon{margin-top:24px;background:#fff;border:2px dashed var(--line);border-radius:18px;padding:16px 20px;color:var(--ink2)}
/* revision */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 16px}
.tog{font:800 18px 'Nunito Sans',Arial,sans-serif;border:2px solid var(--main);background:#fff;color:var(--deep);border-radius:999px;padding:9px 18px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--main);color:#fff}
.topic{background:#fff;border:2px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}
.topic summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:14px;padding:14px 18px;font:900 23px 'Archivo',Arial,sans-serif;color:var(--deep)}
.topic summary::-webkit-details-marker{display:none}
.topic summary .em{font-size:34px;line-height:1}
.topic summary .sub2{display:block;font:700 16px 'Nunito Sans',Arial,sans-serif;color:var(--ink2)}
.topic summary::after{content:'+';margin-left:auto;font-size:30px;color:var(--main)}
.topic[open] summary::after{content:'–'}
.ph{width:100%;border-collapse:collapse}
.ph td{border-top:2px solid var(--line);padding:10px 12px;vertical-align:middle}
.ph td.t{font-weight:800;color:var(--deep);width:52%}
.ph td.s{width:56px;padding:6px}
.cover .ph td.en{color:transparent;background:repeating-linear-gradient(135deg,var(--pale) 0 8px,#fff 8px 16px)!important;cursor:pointer;border-radius:0}
.cover .ph td.en.show{color:var(--ink);background:#fff!important}
@media(max-width:600px){.ph td{display:block;width:auto!important;border-top:none;padding:4px 14px}.ph tr{display:grid;grid-template-columns:1fr 52px;border-top:2px solid var(--line);padding:8px 0}.ph td.t{grid-column:1}.ph td.s{grid-column:2;grid-row:1 / span 2;align-self:center}.ph td.en{grid-column:1}}
.say{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--pale);font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say:active{transform:scale(.94)}
/* grammar */
.gp{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.gp h3{margin-top:0}
.ex{display:grid;gap:8px;margin-top:10px}
.ex div{display:flex;gap:12px;align-items:center;background:var(--pale);border-radius:12px;padding:10px 12px}
.ex b{color:var(--deep)}.ex span{color:var(--ink2);display:block;font-size:18px}
.tip{margin-top:12px;background:#FFF6DF;border-left:6px solid #E8A33D;border-radius:10px;padding:10px 14px;font-size:19px}
/* skills */
.model{background:#fff;border:2px solid var(--main);border-radius:18px;padding:16px 18px;margin:14px 0}
.model h3{margin:0 0 8px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.model .tx{font-size:21px;line-height:1.55;color:var(--deep);font-weight:700}
.model details{margin-top:10px}.model summary{cursor:pointer;font-weight:800;color:var(--main)}
.model .en{margin-top:8px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips span{background:var(--pale);color:var(--deep);border-radius:10px;padding:6px 12px;font-size:17px;font-weight:700}
.tr{display:grid;gap:10px}
.tr button{text-align:left;font:700 20px 'Nunito Sans',Arial,sans-serif;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;color:var(--ink)}
.tr button i{display:block;font-style:normal;color:var(--main);font-weight:800;margin-top:4px;visibility:hidden}
.tr button.show i{visibility:visible}
.tr button small{display:block;font-size:15px;color:var(--ink2);font-weight:700}
.dict{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.dq{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dq input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;flex:1 1 220px;min-width:0}
.dq .chk{font:800 18px 'Archivo',Arial,sans-serif;background:var(--main);color:#fff;border:none;border-radius:12px;padding:12px 18px;cursor:pointer}
.dq .res{flex-basis:100%;font-size:19px;font-weight:700}.dq .res:empty{display:none}
.dq .res.ok{color:var(--good)}.dq .res.no{color:var(--bad)}
.dq .num{font:900 22px 'Archivo',Arial,sans-serif;color:var(--main);min-width:22px}
.voicenote{font-size:17px;color:var(--ink2);margin-top:8px}
/* GCSE word list */
.hb{display:inline-block;background:#E8A33D;color:#fff;font:900 13px 'Archivo',Arial,sans-serif;border-radius:6px;padding:2px 6px;vertical-align:2px}
.vsearch{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin:4px 0 12px;background:#fff}
#vl .topic{margin-bottom:14px}
/* exam practice */
.ep{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px}
.ep h3{margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tb{display:inline-block;font:900 14px 'Archivo',Arial,sans-serif;border-radius:8px;padding:3px 9px;color:#fff;background:var(--main)}.tb.H{background:#E8A33D}
.plays{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.plays .big{font-size:19px;padding:12px 18px}
.passage{background:var(--pale);border-radius:14px;padding:14px 16px;font-size:21px;line-height:1.55;color:var(--deep);font-weight:700;margin:10px 0}
.pq{margin-top:14px}.pq .qt{font-weight:800;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;font:700 19px 'Nunito Sans',Arial,sans-serif;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.opts button b{display:inline-block;width:30px;color:var(--main)}
.opts button[aria-pressed="true"]{border-color:var(--deep);background:var(--pale)}
.opts button.right{background:#E3F2E4;border-color:var(--good)}.opts button.wrong{background:#FBE4E2;border-color:var(--bad)}
.fbk{font-weight:800;margin-top:6px;min-height:0}.fbk.ok{color:var(--good)}.fbk.no{color:var(--bad)}
.sa textarea,.tx2 textarea{width:100%;font:inherit;font-size:19px;border:2px solid var(--line);border-radius:12px;padding:10px;min-height:56px}
.ans2{display:none;background:#E3F2E4;border-radius:10px;padding:8px 12px;margin-top:6px;font-weight:700}.ans2.show{display:block}
.small2{font:800 17px 'Archivo',Arial,sans-serif;background:#fff;color:var(--deep);border:2px solid var(--main);border-radius:12px;padding:9px 14px;cursor:pointer;margin-top:8px}
.gapl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.gapl select{font:inherit;font-size:19px;padding:6px 10px;border-radius:10px;border:2px solid var(--line)}
.boxw{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.boxw span{border:2px dashed var(--main);border-radius:10px;padding:4px 12px;font-weight:800}
.mk{display:grid;gap:12px}.mk div{background:var(--pale);border-radius:14px;padding:14px 16px}.mk b.h{display:block;font:900 21px 'Archivo',Arial,sans-serif;color:var(--deep);margin-bottom:4px}
/* flashcards: same Leitner boxes as the other Peckham Hub apps */
:root{--card:#fff}
.fc{position:relative;height:300px;border:none;background:none;width:100%;padding:0}
.fc .face{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;backface-visibility:hidden;transition:transform .5s;border:2px solid var(--line);text-align:center}
.fc .front{background:var(--ink);color:var(--paper)}
.fc .front b{font-family:'Fredoka';font-size:clamp(30px,5vw,42px)}
.fc .back{background:var(--card);transform:rotateY(180deg);font-size:22px}
.fc.flip .front{transform:rotateY(180deg)} .fc.flip .back{transform:rotateY(360deg)}
.fc small{font-size:16px;opacity:.8;margin-top:12px}
@media (prefers-reduced-motion:reduce){.fc .face{transition:none}}
/* Leitner flashcards */
.lt{max-width:820px}
.lt-top{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.lt-stat{flex:1 1 150px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.lt-stat b{display:block;font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:34px;line-height:1.1;color:var(--ink)}
.lt-stat span{font-size:16px;color:var(--ink2);font-weight:700}
.lt-xp{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.lt-xp i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .5s}
.lt-boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 0 18px}
.lt-boxes{padding-top:8px}
.lt-box{position:relative;height:150px;color:#fff;text-align:center}
.lt-box.b1{--c:#B3261E;--top:#D9574F;--in:#5E120E}.lt-box.b2{--c:#C0631A;--top:#E38A45;--in:#663209}
.lt-box.b3{--c:#B08A00;--top:#D9B23A;--in:#5C4800}.lt-box.b4{--c:#1F7A9C;--top:#4FA6C6;--in:#0C3B4D}.lt-box.b5{--c:#2E7D32;--top:#5DAA61;--in:#123F15}
.lt-box .lid{position:absolute;left:0;right:0;top:0;height:34px;background:var(--top);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}
.lt-box .lid::after{content:'';position:absolute;left:9%;right:9%;top:5px;bottom:4px;background:var(--in);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.lt-box .stack{position:absolute;left:0;right:0;top:-6px;height:40px;z-index:1;pointer-events:none}
.lt-box .stack i{position:absolute;left:50%;bottom:0;width:48%;height:36px;margin-left:-24%;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.35);border-top:4px solid var(--top)}
.lt-box .stack i:nth-child(1){transform:translateX(-14%) rotate(-9deg)}.lt-box .stack i:nth-child(2){transform:translateX(12%) rotate(7deg)}.lt-box .stack i:nth-child(3){transform:translateY(-6px)}
.lt-box .front{position:absolute;left:0;right:0;top:32px;bottom:0;z-index:2;border-radius:3px 3px 14px 14px;padding:10px 4px 8px;display:flex;flex-direction:column;justify-content:flex-end;
 background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 14%,rgba(255,255,255,.08) 50%,rgba(0,0,0,0) 86%,rgba(0,0,0,.25)),var(--c);
 box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -10px 0 rgba(0,0,0,.2),0 8px 0 -2px rgba(0,0,0,.18),0 12px 16px rgba(0,0,0,.22)}
.lt-box .n{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:38px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lt-box .l{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:19px;margin-top:4px}
.lt-box .w{font-size:14px;font-weight:700;opacity:.95;margin-top:2px;line-height:1.2}
.lt-box.pulse{animation:ltpulse .6s}
@keyframes ltpulse{40%{transform:translateY(-6px) scale(1.06)}}
.lt-burst{position:absolute;left:50%;top:14px;width:0;height:0;z-index:5;pointer-events:none}
.lt-burst i{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:ltconf 1s cubic-bezier(.2,.7,.4,1) forwards}
.lt-burst i.r{width:10px;height:10px;border-radius:50%}
@keyframes ltconf{0%{opacity:1;transform:translate(0,0) rotate(0)}65%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r))}100%{opacity:0;transform:translate(calc(var(--x)*1.15),calc(var(--y) + 46px)) rotate(calc(var(--r)*1.6))}}
@media(max-width:560px){.lt-boxes{gap:6px}.lt-box{height:136px}.lt-box .lid{height:28px}.lt-box .front{top:26px;border-radius:3px 3px 10px 10px;padding:8px 2px 7px}.lt-box .n{font-size:30px}.lt-box .l{font-size:16px}.lt-box .w{font-size:12px}.lt-box .stack i{height:28px}}
@media (prefers-reduced-motion:reduce){.lt-box.pulse,.lt-burst i{animation:none}}
.lt-big{font-size:21px;padding:14px 22px}
.lt-msg{font-size:20px;margin:6px 0 14px}
.lt-run .qhead{display:flex;justify-content:space-between;font-weight:700;font-size:18px;color:var(--ink2);margin-bottom:6px}
.lt-run .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.lt-run .bar i{display:block;height:100%;background:var(--main);transition:width .3s}
.lt-tag{display:inline-block;font-weight:800;font-size:15px;color:#fff;border-radius:99px;padding:4px 12px;margin-bottom:8px}
.lt-run .fc{height:320px}
.lt-run .fc .back{font-size:24px;line-height:1.35}
.lt-ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lt-ans button{border:none;border-radius:16px;padding:18px 10px;font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:24px;color:#fff;cursor:pointer}
.lt-ans .no{background:var(--bad)}.lt-ans .yes{background:var(--good)}
.lt-ans button:disabled{opacity:.35;cursor:default}
.lt-hint{font-size:18px;color:var(--ink2);text-align:center;margin-top:10px;min-height:26px;font-weight:700}
.lt-pop{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-size:22px;text-align:center;margin-top:10px;min-height:30px}
.lt-pop.up{color:var(--good)}.lt-pop.down{color:var(--bad)}
.lt-end .score{font-size:64px}
.lt-list{display:grid;gap:8px;margin-top:12px}
.lt-list div{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:18px}
.lt-how{margin-top:18px}
.lt-how summary{cursor:pointer;font-weight:800;font-size:19px}
.lt-how p{font-size:18px;margin-top:8px}
.lt{max-width:820px}
.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 20px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{font-family:'Archivo',Arial,sans-serif;font-weight:800;border:none;border-radius:14px;background:var(--main);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--deep);border:2px solid var(--main)}
.fc .front{background:var(--deep)!important;color:#fff!important}
.fc .back{color:var(--deep)}
body:has(.lt-run) .phub{display:none}
.lt-say{display:flex;justify-content:center;margin-top:10px}
.decks{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.decks button{font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:18px;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:14px;padding:10px 16px;cursor:pointer}
.decks button[aria-pressed="true"]{background:var(--pale);border-color:var(--main)}
.decks small{font-weight:700;opacity:.75}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chipset button{font:800 17px 'Nunito Sans',Arial,sans-serif;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:8px 14px;cursor:pointer}
.chipset button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.big{font:900 22px 'Archivo',Arial,sans-serif;border:none;border-radius:16px;background:var(--main);color:#fff;padding:16px 26px;cursor:pointer}
.big.alt{background:#fff;color:var(--deep);border:2px solid var(--main)}
.run .qhead{display:flex;justify-content:space-between;font-weight:800;font-size:18px;color:var(--ink2);margin-bottom:6px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .4s}
.endscore{font:900 60px 'Archivo',Arial,sans-serif;color:var(--main)}
.how{margin-top:18px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px}.how summary{cursor:pointer;font-weight:800}.how p{margin-top:8px;font-size:19px}
/* picture glossary: same layout as the other Peckham Hub apps */
.pgsearch{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;font-size:19px;margin:6px 0 12px;box-sizing:border-box}
.pgsets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pgsets button{font-weight:800;font-size:17px;border:2px solid var(--line);background:#fff;color:var(--deep,#102A43);border-radius:999px;padding:8px 16px;cursor:pointer}
.pgsets button[aria-pressed="true"]{background:var(--deep,#102A43);color:#fff;border-color:var(--deep,#102A43)}
.pgl h3{margin:20px 0 10px;font-size:23px}
.pgx{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.pgx>div{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;line-height:1.4;color:#102A43}
.hi-i{display:block;width:128px;height:128px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px;box-sizing:border-box}
.hi-i svg{width:100%;height:100%;display:block}
.pgx .pgw{display:block;font-size:24px;margin-bottom:4px}
@media (max-width:480px){.pgx>div{grid-template-columns:96px 1fr;gap:12px}.hi-i{width:96px;height:96px}}
.pgx .pge{display:block;color:var(--ink2);font-size:18px}.pgx .say{width:40px;height:40px;margin-top:6px}
/* quiz */
.qcard{background:#fff;border-radius:18px;padding:18px;border:2px solid var(--line)}
.qq{font:800 23px 'Nunito Sans',Arial,sans-serif;margin-bottom:14px}
.qopts{display:grid;gap:10px}
.qopts button{text-align:left;font:700 20px 'Nunito Sans',Arial,sans-serif;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;color:var(--ink)}
.qopts button b{display:inline-block;width:34px;color:var(--main)}
.qopts button.right{background:#E3F2E4;border-color:var(--good)}.qopts button.wrong{background:#FBE4E2;border-color:var(--bad)}
.qfb{margin-top:14px;font-size:20px}.qfb strong{display:block;font-size:22px}
.phub{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;background:#102A43;color:#F4B740;font:800 18px/1 'Archivo',Arial,sans-serif;padding:13px 18px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35);border:2px solid #F4B740}
body.running .phub{display:none}
footer{max-width:1000px;margin:0 auto;padding:0 20px 30px;font-size:16px;color:var(--ink2)}
@media print{nav.tabs,.years,.phub,.say{display:none!important}body{background:#fff}}
</style>

oy simpático.", "I am kind."], ["Mi madre es alta.", "My mum is tall."], ["Mis abuelos son divertidos.", "My grandparents are fun."]]}, {"t": "tener: to have", "p": "Use <b>tener<\/b> for your age, your hair and eyes, and your brothers and sisters. In Spanish you <i>have<\/i> years: <i>Tengo doce años.<\/i>", "table": {"head": ["", "tener", "English"], "rows": [["yo", "tengo", "I have"], ["tú", "tienes", "you have"], ["él / ella", "tiene", "he / she has"], ["nosotros", "tenemos", "we have"], ["vosotros", "tenéis", "you (all) have"], ["ellos / ellas", "tienen", "they have"]]}, "ex": [["Tengo el pelo corto.", "I have short hair."], ["Mi hermano tiene trece años.", "My brother is 13."], ["¿Tienes hermanos?", "Do you have brothers and sisters?"]]}, {"t": "my, your, his, her", "p": "Use <b>mi, tu, su<\/b> with one thing. Use <b>mis, tus, sus<\/b> with more than one.", "table": {"head": ["", "one thing", "more than one"], "rows": [["my", "mi", "mis"], ["your", "tu", "tus"], ["his / her", "su", "sus"]]}, "ex": [["mi hermano", "my brother"], ["mis abuelos", "my grandparents"], ["tu madre", "your mother"], ["sus primos", "his / her cousins"]], "tip": "<i>tu<\/i> (your) has no accent. <i>tú<\/i> (you) does."}, {"t": "Adjectives: where they go and how they agree", "p": "Most adjectives go <b>after<\/b> the noun, and they change their ending to match it.", "table": {"head": ["masculine", "feminine", "plural"], "rows": [["alto", "alta", "altos / altas"], ["simpático", "simpática", "simpáticos / simpáticas"], ["inteligente", "inteligente", "inteligentes"], ["azul", "azul", "azules"]]}, "ex": [["el pelo negro", "black hair"], ["los ojos verdes", "green eyes"], ["Mi hermana es baja.", "My sister is short."]], "tip": "Adjectives ending in <b>-e<\/b> or a consonant stay the same for a girl: <i>Es inteligente. Es azul.<\/i>"}, {"t": "Negatives", "p": "Put <b>no<\/b> in front of the verb.", "ex": [["No soy tímido.", "I am not shy."], ["No tengo hermanos.", "I don't have any brothers or sisters."], ["Mi padre no es serio.", "My dad is not serious."]]}, {"t": "Use the question to build your answer", "p": "Change <b>tu<\/b> to <b>mi<\/b>, and change the <b>tú<\/b> verb to the <b>yo<\/b> verb.", "table": {"head": ["Question", "Answer"], "rows": [["¿Cómo te llamas?", "Me llamo…"], ["¿Cuántos años tienes?", "Tengo … años."], ["¿Cómo eres?", "Soy…"], ["¿Tienes hermanos?", "Tengo… / No tengo hermanos."], ["¿Cuándo es tu cumpleaños?", "Mi cumpleaños es el…"]]}}], "skills": [{"k": "h", "t": "Your speaking or writing task"}, {"k": "p", "t": "You will do one of these: your teacher will tell you which. Either way, you introduce yourself, describe your appearance and personality, and talk about your family."}, {"k": "model", "t": "Model answer", "text": "¡Hola! Me llamo Sam y tengo doce años. Mi cumpleaños es el cinco de mayo. Soy bastante alto y tengo el pelo negro y corto. Tengo los ojos marrones. Soy simpático y muy divertido, pero a veces soy perezoso. En mi familia hay cuatro personas: mi madre, mi padre, mi hermana y yo. Mi hermana se llama Ana. Es baja y tiene el pelo largo. Es inteligente, pero no es habladora. Me llevo bien con mi hermana porque es simpática.", "en": "Hello! My name is Sam and I am 12. My birthday is the 5th of May. I am quite tall and I have short black hair. I have brown eyes. I am kind and very fun, but sometimes I am lazy. There are four people in my family: my mum, my dad, my sister and me. My sister is called Ana. She is short and she has long hair. She is clever, but she isn't chatty. I get on well with my sister because she is nice.", "notes": ["Connectives: <i>y, pero<\/i>", "Intensifiers: <i>bastante, muy, a veces<\/i>", "A negative: <i>no es habladora<\/i>", "An opinion with a reason: <i>porque es simpática<\/i>"]}, {"k": "h", "t": "Reading aloud: the sounds of Spanish"}, {"k": "p", "t": "Spanish is spelt the way it sounds. Learn these and you can read any word out loud."}, {"k": "sounds", "rows": [["a, e, i, o, u", "always short and clear: ah, eh, ee, oh, oo", "Ana, pelo"], ["h", "silent: never say it", "hola, hermano"], ["j, and g before e or i", "a breathy, throaty \"h\"", "joven, gente"], ["ll", "like \"y\" in yes", "me llamo"], ["ñ", "\"ny\", as in canyon", "año, España"], ["qu", "\"k\" (the u is silent)", "quince, ¿qué?"], ["z, and c before e or i", "\"th\" in Spain (\"s\" in Latin America)", "doce, azul"], ["r / rr", "r is a quick tap; rr (and r at the start of a word) is rolled", "pero, perro, rojo"], ["v", "a soft \"b\"", "verde, vivo"], ["accent (á, é, í, ó, ú)", "say that part of the word louder", "música, inglés"]]}, {"k": "h", "t": "Listen and write"}, {"k": "p", "t": "Tap play, write what you hear, then check. Accents count!"}, {"k": "dict", "items": ["Me llamo Ana.", "Tengo doce años.", "Tengo el pelo largo.", "Mi hermano es alto.", "Mi cumpleaños es en julio."]}], "quiz": [{"q": "What does <i>Tengo doce años<\/i> mean?", "a": "I am 12 years old", "w": ["I have 12 brothers", "My birthday is on the 12th", "I live at number 12"], "why": "Spanish uses <i>tener<\/i> (to have) for age: you \"have\" 12 years."}, {"q": "A girl wants to say \"I am tall\". Which is right?", "a": "Soy alta.", "w": ["Soy alto.", "Tengo alta.", "Es alta."], "why": "A girl uses the feminine ending -a, and <i>soy<\/i> means \"I am\"."}, {"q": "Tengo los ojos ___ (blue eyes)", "a": "azules", "w": ["azul", "azula", "azulos"], "why": "<i>Ojos<\/i> is plural, so <i>azul<\/i> adds -es."}, {"q": "How do you say \"my parents\"?", "a": "mis padres", "w": ["mi padres", "mis padre", "tu padres"], "why": "More than one person, so <i>mi<\/i> becomes <i>mis<\/i>."}, {"q": "Which word means \"lazy\"?", "a": "perezoso", "w": ["divertido", "hablador", "simpático"], "why": "<i>Divertido<\/i> = fun, <i>hablador<\/i> = chatty, <i>simpático<\/i> = kind."}, {"q": "No ___ hermanos. (I don't have any brothers or sisters.)", "a": "tengo", "w": ["soy", "tiene", "tienes"], "why": "<i>No<\/i> goes before the verb, and <i>tengo<\/i> means \"I have\"."}, {"q": "What month is <i>julio<\/i>?", "a": "July", "w": ["June", "January", "April"], "why": "<i>Junio<\/i> is June. Months have no capital letter in Spanish."}, {"q": "How do you write 15 in Spanish?", "a": "quince", "w": ["cinco", "catorce", "cincuenta"], "why": "<i>Cinco<\/i> = 5, <i>catorce<\/i> = 14, <i>cincuenta<\/i> = 50."}, {"q": "Someone asks <i>¿Cómo te llamas?<\/i> Which answer fits?", "a": "Me llamo Sam.", "w": ["Tengo doce años.", "Soy simpático.", "Estoy bien."], "why": "Use the question: <i>te llamas<\/i> → <i>me llamo<\/i>."}, {"q": "Which sentence is correct?", "a": "Mi hermana es inteligente.", "w": ["Mi hermana tiene inteligente.", "Mi hermana es inteligenta.", "Mis hermana es inteligente."], "why": "<i>Inteligente<\/i> ends in -e, so it does not change for a girl."}, {"q": "What does <i>Soy hija única<\/i> mean?", "a": "I am an only child (girl)", "w": ["I have one daughter", "I am the only sister", "My aunt is unique"], "why": "<i>Hijo único / hija única<\/i> = only child."}, {"q": "Which means \"I get on well with my dad\"?", "a": "Me llevo bien con mi padre.", "w": ["Me llamo bien con mi padre.", "Tengo bien con mi padre.", "Soy bien con mi padre."], "why": "<i>Llevarse bien con<\/i> = to get on well with."}]}, "8": {"stage": "Key Stage 3 · Autumn Assessment", "examFacts": [["4 short exams", "Listening, Reading and Grammar, plus Writing <i>or<\/i> Speaking."], ["15 minutes", "each for Listening, Reading and Grammar."], ["25 minutes", "for Writing. Or a 5-minute Speaking exam, with 5 minutes to prepare."], ["1 pen", "All you need to bring."]], "examNote": "Year 8 exams run from Monday 30 November to Friday 11 December 2026. Your teacher will tell you whether you do the Writing exam or the Speaking exam.", "topics": [{"h": "Listening and Reading", "items": ["Places in town", "Good and bad things about your town", "Activities around town, and the weather", "School"]}, {"h": "Writing", "items": ["A vocabulary quiz", "Translating key phrases from English", "A blog: describe your town, its good and bad points, what you do when the weather is good, and your plans for next weekend"]}, {"h": "Speaking", "items": ["Reading aloud", "Conversation: where you live, what your town is like, where you go at the weekend, and your plans for next weekend"]}, {"h": "Grammar", "items": ["Prepositions and contractions: <i>al, del<\/i>", "<i>hay<\/i> (there is / are) and <i>tener<\/i> in the present tense", "Regular -ar and -ir verbs in the present tense", "Word order", "The near future tense: <i>voy a<\/i> + infinitive"]}], "alsoKnow": "Also know your core words: connectives, intensifiers, opinions, and the present and future tenses.", "prepare": ["Look back through your exercise book at the tasks and questions from your lessons.", "Missed a lesson? Ask your teacher, or someone in your class, what you missed and catch up.", "Learn the phrases in the <a href=\"#rev\">Revision<\/a> tab, then test yourself in the <a href=\"#flash\">Flashcards<\/a>.", "Check the rules in the <a href=\"#gram\">Grammar<\/a> tab, then do the <a href=\"#quiz\">Quiz<\/a>.", "Practise your speaking out loud with a friend or someone at home. Tap 🔊 to hear how the Spanish sounds.", "Write key words out several times to learn the spelling."], "links": [["BBC Bitesize KS3 Spanish", "https://www.bbc.co.uk/bitesize/subjects/zfckjxs"], ["Oak National Academy: Key Stage 3 Spanish", "https://www.thenational.academy/teachers/programmes/spanish-secondary-ks3-l/units"], ["Harris Quizlet: Year 8 Spanish", "https://quizlet.com/user/HFLanguages/folders/y08sp_autumn"]], "top": ["<b>Use a time phrase to start sentences:<\/b> <i>Los sábados…, Cuando hace sol…, El fin de semana que viene…<\/i>", "<b>Give opinions with reasons:<\/b> <i>Lo bueno es que hay mucho que hacer.<\/i>", "<b>Use two tenses:<\/b> the present (<i>voy al parque<\/i>) and the near future (<i>voy a ir al cine<\/i>).", "<b>Link weather and activities:<\/b> <i>Cuando llueve, veo la tele.<\/i>", "<b>Remember <i>al<\/i>:<\/b> <i>a + el = al<\/i>, so <i>voy al parque<\/i>, not <i>voy a el parque<\/i>."], "rev": [{"t": "Places in town", "e": "🏙️", "rows": [["En mi ciudad hay…", "In my town there is / there are…"], ["un parque", "a park"], ["una piscina", "a swimming pool"], ["un polideportivo", "a sports centre"], ["un centro comercial", "a shopping centre"], ["un cine", "a cinema"], ["una biblioteca", "a library"], ["un mercado", "a market"], ["un museo", "a museum"], ["una estación de tren", "a train station"], ["muchas tiendas", "lots of shops"], ["No hay estadio", "There isn't a stadium"]]}, {"t": "Good and bad things", "e": "👍", "rows": [["Lo bueno es que…", "The good thing is that…"], ["Lo malo es que…", "The bad thing is that…"], ["Es animado", "It's lively"], ["Es tranquilo", "It's quiet"], ["Es bonito", "It's pretty"], ["Es ruidoso", "It's noisy"], ["Está sucio", "It's dirty"], ["Hay mucho tráfico", "There is a lot of traffic"], ["Hay mucha basura", "There is a lot of litter"], ["Hay mucho que hacer", "There is lots to do"], ["No hay nada que hacer", "There is nothing to do"]]}, {"t": "Weather and activities", "e": "☀️", "rows": [["¿Qué tiempo hace?", "What's the weather like?"], ["Hace sol", "It's sunny"], ["Hace calor", "It's hot"], ["Hace frío", "It's cold"], ["Hace buen tiempo", "The weather is good"], ["Hace mal tiempo", "The weather is bad"], ["Llueve", "It rains / It's raining"], ["Nieva", "It snows / It's snowing"], ["Cuando hace sol, voy al parque", "When it's sunny, I go to the park"], ["Juego al fútbol", "I play football"], ["Monto en bici", "I ride my bike"], ["Salgo con mis amigos", "I go out with my friends"], ["Cuando llueve, veo la tele", "When it rains, I watch TV"]]}, {"t": "Next weekend", "e": "📅", "rows": [["El fin de semana que viene…", "Next weekend…"], ["El sábado", "On Saturday"], ["Voy a ir al cine", "I am going to go to the cinema"], ["Voy a jugar al baloncesto", "I am going to play basketball"], ["Vamos a comer en un restaurante", "We are going to eat in a restaurant"], ["Va a ser genial", "It's going to be great"], ["Después", "Afterwards"], ["Por la tarde", "In the afternoon / evening"]]}, {"t": "School", "e": "🏫", "rows": [["Mi asignatura favorita es el inglés", "My favourite subject is English"], ["Me gustan las ciencias", "I like science"], ["Me encanta el dibujo", "I love art"], ["No me gustan las matemáticas", "I don't like maths"], ["Odio la historia", "I hate history"], ["porque es interesante", "because it's interesting"], ["porque es aburrido", "because it's boring"], ["porque es fácil / difícil", "because it's easy / difficult"], ["El profesor es simpático", "The teacher is nice"]]}], "gram": [{"t": "al and del", "p": "When <b>a<\/b> (to) or <b>de<\/b> (of / from) meets <b>el<\/b>, they join together.", "table": {"head": ["", "becomes", "English"], "rows": [["a + el parque", "al parque", "to the park"], ["a + la piscina", "a la piscina", "to the pool (no change)"], ["de + el centro", "del centro", "from the centre"]]}, "ex": [["Voy al cine.", "I go to the cinema."], ["Vivo cerca del parque.", "I live near the park."]], "tip": "Only <i>el<\/i> joins up. <i>a la, a los, a las<\/i> do not change."}, {"t": "hay and tener", "p": "<b>hay<\/b> means \"there is\" or \"there are\". <b>no hay<\/b> means \"there isn't / there aren't\": leave out <i>un / una<\/i> after it.", "ex": [["En mi ciudad hay un parque.", "In my town there is a park."], ["No hay piscina.", "There isn't a swimming pool."], ["Tengo muchos amigos aquí.", "I have lots of friends here."]]}, {"t": "Regular -ar verbs: hablar (to speak)", "p": "Take off <b>-ar<\/b> and add the ending.", "table": {"head": ["", "hablar", "English"], "rows": [["yo", "hablo", "I speak"], ["tú", "hablas", "you speak"], ["él / ella", "habla", "he / she speaks"], ["nosotros", "hablamos", "we speak"], ["vosotros", "habláis", "you (all) speak"], ["ellos / ellas", "hablan", "they speak"]]}, "ex": [["Escucho música.", "I listen to music."], ["Mi hermana monta en bici.", "My sister rides her bike."]]}, {"t": "Regular -ir verbs: vivir (to live)", "p": "Take off <b>-ir<\/b> and add the ending.", "table": {"head": ["", "vivir", "English"], "rows": [["yo", "vivo", "I live"], ["tú", "vives", "you live"], ["él / ella", "vive", "he / she lives"], ["nosotros", "vivimos", "we live"], ["vosotros", "vivís", "you (all) live"], ["ellos / ellas", "viven", "they live"]]}, "ex": [["Vivo en Londres.", "I live in London."], ["Mis abuelos viven en Colombia.", "My grandparents live in Colombia."]]}, {"t": "The near future: going to", "p": "Use <b>ir<\/b> (to go) + <b>a<\/b> + an infinitive.", "table": {"head": ["", "ir", "+ a + infinitive"], "rows": [["yo", "voy", "a jugar"], ["tú", "vas", "a ver"], ["él / ella", "va", "a comer"], ["nosotros", "vamos", "a ir"], ["vosotros", "vais", "a salir"], ["ellos / ellas", "van", "a nadar"]]}, "ex": [["Voy a ver una película.", "I am going to watch a film."], ["Mi madre va a comprar ropa.", "My mum is going to buy clothes."]], "tip": "Don't forget the <b>a<\/b>: <i>voy a jugar<\/i>, not <i>voy jugar<\/i>."}, {"t": "Word order", "p": "A simple pattern for a strong sentence: <b>when<\/b> + <b>verb<\/b> + <b>where<\/b> + <b>who with<\/b> + <b>opinion<\/b>.", "ex": [["El sábado voy a ir al cine con mis amigos. ¡Va a ser genial!", "On Saturday I'm going to go to the cinema with my friends. It's going to be great!"]], "tip": "Adjectives come after the noun (<i>un parque bonito<\/i>) and <i>no<\/i> comes before the verb."}], "skills": [{"k": "h", "t": "Your speaking or writing task"}, {"k": "p", "t": "Write a blog (or talk) about your town: what there is, the good and bad points, what you do when the weather is good, and your plans for next weekend."}, {"k": "model", "t": "Model blog", "text": "Vivo en Peckham, en el sureste de Londres. En mi barrio hay un parque, una biblioteca y muchas tiendas, pero no hay piscina. Lo bueno es que es animado y hay mucho que hacer. Lo malo es que hay mucho tráfico y a veces es ruidoso. Cuando hace buen tiempo, voy al parque con mis amigos y jugamos al fútbol. Cuando llueve, voy al cine o escucho música en casa. El fin de semana que viene, voy a ir al centro comercial con mi hermana. Vamos a comprar ropa y después vamos a comer pizza. ¡Va a ser genial!", "en": "I live in Peckham, in south-east London. In my area there is a park, a library and lots of shops, but there isn't a pool. The good thing is that it's lively and there's lots to do. The bad thing is that there's lots of traffic and sometimes it's noisy. When the weather is good, I go to the park with my friends and we play football. When it rains, I go to the cinema or listen to music at home. Next weekend I'm going to go to the shopping centre with my sister. We're going to buy clothes and afterwards we're going to eat pizza. It's going to be great!", "notes": ["<i>hay / no hay<\/i>", "<i>Lo bueno… Lo malo…<\/i>", "Weather + activity: <i>Cuando hace buen tiempo…<\/i>", "Near future: <i>voy a ir, vamos a comprar<\/i>"]}, {"k": "h", "t": "Reading aloud: the sounds of Spanish"}, {"k": "sounds", "rows": [["a, e, i, o, u", "always short and clear: ah, eh, ee, oh, oo", "Ana, pelo"], ["h", "silent: never say it", "hola, hermano"], ["j, and g before e or i", "a breathy, throaty \"h\"", "joven, gente"], ["ll", "like \"y\" in yes", "me llamo"], ["ñ", "\"ny\", as in canyon", "año, España"], ["qu", "\"k\" (the u is silent)", "quince, ¿qué?"], ["z, and c before e or i", "\"th\" in Spain (\"s\" in Latin America)", "doce, azul"], ["r / rr", "r is a quick tap; rr (and r at the start of a word) is rolled", "pero, perro, rojo"], ["v", "a soft \"b\"", "verde, vivo"], ["accent (á, é, í, ó, ú)", "say that part of the word louder", "música, inglés"]]}, {"k": "h", "t": "Listen and write"}, {"k": "p", "t": "Tap play, write what you hear, then check. Accents count!"}, {"k": "dict", "items": ["En mi ciudad hay un parque.", "Lo malo es que hay mucho tráfico.", "Cuando hace sol, voy al parque.", "El sábado voy a jugar al fútbol.", "Mi asignatura favorita es el dibujo."]}], "quiz": [{"q": "In <i>Voy al parque<\/i>, what is <i>al<\/i>?", "a": "a + el: \"to the\"", "w": ["\"all the\"", "\"of the\"", "\"in the\""], "why": "<i>a + el<\/i> always joins up to make <i>al<\/i>."}, {"q": "How do you say \"There isn't a swimming pool\"?", "a": "No hay piscina.", "w": ["No es piscina.", "No tengo piscina.", "Hay no piscina."], "why": "<i>No hay<\/i> + noun, with no <i>un / una<\/i>."}, {"q": "What does <i>Hace frío<\/i> mean?", "a": "It's cold", "w": ["It's hot", "It's raining", "It's sunny"], "why": "<i>Hace calor<\/i> = it's hot; <i>llueve<\/i> = it's raining."}, {"q": "\"I am going to play\" is…", "a": "Voy a jugar", "w": ["Voy jugar", "Juego a ir", "Va a jugar"], "why": "<i>ir + a<\/i> + infinitive. <i>Va<\/i> = he / she is going."}, {"q": "<i>vivir<\/i>: \"we live\" is…", "a": "vivimos", "w": ["vivo", "viven", "vivís"], "why": "nosotros → -imos for -ir verbs."}, {"q": "<i>hablar<\/i>: \"they speak\" is…", "a": "hablan", "w": ["hablas", "hablamos", "habla"], "why": "ellos / ellas → -an for -ar verbs."}, {"q": "What does <i>Lo malo es que…<\/i> mean?", "a": "The bad thing is that…", "w": ["The good thing is that…", "It is bad that I…", "I don't like…"], "why": "<i>Lo bueno<\/i> = the good thing; <i>lo malo<\/i> = the bad thing."}, {"q": "Which means \"library\"?", "a": "la biblioteca", "w": ["la librería", "el mercado", "la piscina"], "why": "Careful: <i>la librería<\/i> is a bookshop."}, {"q": "What does <i>Llueve<\/i> mean?", "a": "It's raining", "w": ["It's snowing", "It's windy", "It's cloudy"], "why": "<i>Nieva<\/i> = it's snowing."}, {"q": "Which sentence has the right word order?", "a": "El sábado voy a ir al cine.", "w": ["El sábado voy al a ir cine.", "Voy el sábado ir a al cine.", "El sábado a voy ir al cine."], "why": "When + verb + where."}, {"q": "Why is it <i>Me gustan las ciencias<\/i> (not <i>gusta<\/i>)?", "a": "Because <i>ciencias<\/i> is plural", "w": ["Because I like it a lot", "Because it's the past tense", "Because it's feminine"], "why": "One thing: <i>me gusta<\/i>. More than one: <i>me gustan<\/i>."}, {"q": "What does <i>Salgo con mis amigos<\/i> mean?", "a": "I go out with my friends", "w": ["I leave my friends", "I talk with my friends", "I eat with my friends"], "why": "<i>Salir<\/i> = to go out; <i>salgo<\/i> = I go out."}]}, "9": {"stage": "Key Stage 3 · Autumn Assessment", "examFacts": [["4 short exams", "Listening, Reading and Grammar, plus Writing <i>or<\/i> Speaking."], ["15 minutes", "each for Listening, Reading and Grammar."], ["25 minutes", "for Writing. Or a 5-minute Speaking exam, with 5 minutes to prepare."], ["1 pen", "All you need to bring."]], "examNote": "Your teacher will tell you whether you do the Writing exam or the Speaking exam, and the dates of your exams.", "topics": [{"h": "Listening and Reading", "items": ["Family relationships", "Relationships with friends", "What you did online in the past", "Social media", "My town"]}, {"h": "Writing", "items": ["Vocabulary and key structures", "Building sentences", "Extended writing: My life online"]}, {"h": "Speaking", "items": ["Reading aloud: pronunciation and intonation", "Photo description: family and friends, relationships and technology"]}, {"h": "Grammar", "items": ["Adjective agreement", "The present tense: regular and irregular verbs", "The preterite and the imperfect (past tenses)"]}], "alsoKnow": "Also know your core words (connectives, intensifiers, opinions) and the present and future tenses.", "prepare": ["Look back through your exercise book at the tasks and questions from your lessons.", "Missed a lesson? Ask your teacher, or someone in your class, what you missed and catch up.", "Learn the phrases in the <a href=\"#rev\">Revision<\/a> tab, then test yourself in the <a href=\"#flash\">Flashcards<\/a>.", "Check the rules in the <a href=\"#gram\">Grammar<\/a> tab, then do the <a href=\"#quiz\">Quiz<\/a>.", "Practise your speaking out loud with a friend or someone at home. Tap 🔊 to hear how the Spanish sounds.", "Write key words out several times to learn the spelling."], "links": [["BBC Bitesize KS3 Spanish", "https://www.bbc.co.uk/bitesize/subjects/zfckjxs"], ["Oak National Academy: Key Stage 3 Spanish", "https://www.thenational.academy/teachers/programmes/spanish-secondary-ks3-l/units"], ["Harris Quizlet: Year 9 Spanish", "https://quizlet.com/user/HFLanguages/folders/y09sp_autumn"]], "top": ["<b>Use three timeframes:<\/b> present (<i>uso mi móvil<\/i>), past (<i>ayer subí una foto<\/i>) and future (<i>voy a…<\/i>).", "<b>Use the imperfect to describe the past:<\/b> <i>Cuando era pequeño, jugaba en el parque.<\/i>", "<b>Give balanced opinions:<\/b> <i>Lo bueno es que… Lo malo es que…<\/i>", "<b>In the photo, say who, where and what:<\/b> <i>En la foto hay dos amigos. Están en un parque. Están usando el móvil.<\/i>", "<b>Check agreement:<\/b> <i>Mis amigas son graciosas.<\/i>"], "rev": [{"t": "Family relationships", "e": "👨‍👩‍👧", "rows": [["Me llevo bien con mi madre", "I get on well with my mum"], ["Me llevo mal con mi hermano", "I get on badly with my brother"], ["Discutimos a menudo", "We argue often"], ["Mi padre me apoya", "My dad supports me"], ["Mi hermana me molesta", "My sister annoys me"], ["Es muy comprensivo / comprensiva", "He / She is very understanding"], ["Es demasiado estricto / estricta", "He / She is too strict"], ["Nos divertimos juntos", "We have fun together"]]}, {"t": "Friends", "e": "🤝", "rows": [["Mi mejor amigo se llama…", "My best friend (boy) is called…"], ["Mi mejor amiga se llama…", "My best friend (girl) is called…"], ["Un buen amigo es leal", "A good friend is loyal"], ["Me hace reír", "He / She makes me laugh"], ["Siempre me escucha", "He / She always listens to me"], ["Nos conocimos en el colegio", "We met at school"], ["Tenemos mucho en común", "We have a lot in common"], ["Es gracioso / graciosa", "He / She is funny"]]}, {"t": "Social media", "e": "📱", "rows": [["las redes sociales", "social media"], ["el móvil", "mobile phone"], ["Mando mensajes", "I send messages"], ["Subo fotos", "I upload photos"], ["Veo vídeos", "I watch videos"], ["Chateo con mis amigos", "I chat with my friends"], ["Descargo música", "I download music"], ["Es divertido pero peligroso", "It's fun but dangerous"], ["el ciberacoso", "cyberbullying"], ["Paso demasiado tiempo en internet", "I spend too much time online"]]}, {"t": "What I did online", "e": "⏪", "rows": [["Ayer", "Yesterday"], ["Anoche", "Last night"], ["El fin de semana pasado", "Last weekend"], ["Subí una foto", "I uploaded a photo"], ["Mandé un mensaje", "I sent a message"], ["Vi un vídeo", "I watched a video"], ["Jugué a los videojuegos", "I played video games"], ["Hablé con mi primo", "I talked to my cousin"], ["Compartí una canción", "I shared a song"], ["Fue divertido", "It was fun"]]}, {"t": "When I was younger", "e": "⏳", "rows": [["Cuando era pequeño / pequeña", "When I was little (boy / girl)"], ["No tenía móvil", "I didn't have a phone"], ["Jugaba en el parque", "I used to play in the park"], ["Veía dibujos animados", "I used to watch cartoons"], ["Era muy tímido / tímida", "I was very shy"], ["Mi barrio era más tranquilo", "My area was quieter"]]}, {"t": "Describing a photo", "e": "🖼️", "rows": [["En la foto hay…", "In the photo there is / there are…"], ["A la izquierda", "On the left"], ["A la derecha", "On the right"], ["En el centro", "In the middle"], ["Están en un parque", "They are in a park"], ["Están usando el móvil", "They are using their phones"], ["Parece que están contentos", "It looks like they are happy"], ["Creo que son amigos", "I think they are friends"]]}], "gram": [{"t": "Adjective agreement", "p": "Adjectives match the noun: masculine or feminine, singular or plural.", "table": {"head": ["masculine", "feminine", "plural"], "rows": [["gracioso", "graciosa", "graciosos / graciosas"], ["hablador", "habladora", "habladores / habladoras"], ["leal", "leal", "leales"], ["egoísta", "egoísta", "egoístas"]]}, "ex": [["Mis amigas son graciosas.", "My friends (girls) are funny."], ["Mi padre es comprensivo.", "My dad is understanding."]]}, {"t": "The present tense", "p": "Take off -ar, -er or -ir and add the ending.", "table": {"head": ["", "-ar: hablar", "-er: comer", "-ir: vivir"], "rows": [["yo", "hablo", "como", "vivo"], ["tú", "hablas", "comes", "vives"], ["él / ella", "habla", "come", "vive"], ["nosotros", "hablamos", "comemos", "vivimos"], ["vosotros", "habláis", "coméis", "vivís"], ["ellos / ellas", "hablan", "comen", "viven"]]}, "tip": "Key irregular \"I\" forms: <i>soy<\/i> (I am), <i>tengo<\/i> (I have), <i>voy<\/i> (I go), <i>hago<\/i> (I do), <i>salgo<\/i> (I go out), <i>veo<\/i> (I watch)."}, {"t": "The preterite: what you did", "p": "Use the preterite for <b>one finished action<\/b> in the past: <i>ayer, anoche, el fin de semana pasado<\/i>.", "table": {"head": ["", "-ar: hablar", "-er / -ir: compartir"], "rows": [["yo", "hablé", "compartí"], ["tú", "hablaste", "compartiste"], ["él / ella", "habló", "compartió"], ["nosotros", "hablamos", "compartimos"], ["vosotros", "hablasteis", "compartisteis"], ["ellos / ellas", "hablaron", "compartieron"]]}, "ex": [["Ayer subí una foto.", "Yesterday I uploaded a photo."], ["Anoche vi un vídeo.", "Last night I watched a video."], ["Fue divertido.", "It was fun."]], "tip": "Learn these: <i>fui<\/i> (I went / I was), <i>hice<\/i> (I did), <i>vi<\/i> (I saw), <i>tuve<\/i> (I had). Spelling: <i>jugar<\/i> → <i>jugué<\/i> keeps the hard \"g\"."}, {"t": "The imperfect: what you used to do", "p": "Use the imperfect for <b>\"used to\"<\/b>, <b>\"was …ing\"<\/b> and <b>descriptions<\/b> in the past.", "table": {"head": ["", "-ar: jugar", "-er / -ir: tener"], "rows": [["yo", "jugaba", "tenía"], ["tú", "jugabas", "tenías"], ["él / ella", "jugaba", "tenía"], ["nosotros", "jugábamos", "teníamos"], ["vosotros", "jugabais", "teníais"], ["ellos / ellas", "jugaban", "tenían"]]}, "ex": [["Cuando era pequeño, jugaba en el parque.", "When I was little, I used to play in the park."], ["No tenía móvil.", "I didn't have a phone."]], "tip": "Only three irregulars: <i>era<\/i> (I was), <i>iba<\/i> (I used to go), <i>veía<\/i> (I used to watch)."}, {"t": "Preterite or imperfect?", "p": "Ask yourself: is it <b>one finished event<\/b> or a <b>background / habit<\/b>?", "table": {"head": ["Preterite", "Imperfect"], "rows": [["Ayer <b>subí<\/b> una foto.", "Antes <b>subía<\/b> muchas fotos."], ["Yesterday I uploaded a photo.", "I used to upload lots of photos."], ["<b>Fue<\/b> divertido. (It was fun: the event.)", "<b>Era<\/b> tímido. (I was shy: a description.)"]]}}], "skills": [{"k": "h", "t": "Extended writing: My life online"}, {"k": "model", "t": "Model answer", "text": "Me encantan las redes sociales porque puedo hablar con mis amigos todos los días. Normalmente uso mi móvil para mandar mensajes y ver vídeos. Lo bueno es que es divertido, pero lo malo es que a veces hay ciberacoso. Ayer subí una foto de mi perro y hablé con mi mejor amiga durante una hora. Anoche vi una serie en mi tableta. Cuando era pequeño, no tenía móvil y jugaba más en el parque. Era más tranquilo. Me llevo bien con mis padres, pero discutimos porque paso mucho tiempo en internet.", "en": "I love social media because I can talk to my friends every day. Normally I use my phone to send messages and watch videos. The good thing is that it's fun, but the bad thing is that sometimes there is cyberbullying. Yesterday I uploaded a photo of my dog and talked to my best friend for an hour. Last night I watched a series on my tablet. When I was little, I didn't have a phone and I used to play in the park more. It was calmer. I get on well with my parents, but we argue because I spend a lot of time online.", "notes": ["Present: <i>uso, me encantan<\/i>", "Preterite: <i>subí, hablé, vi<\/i>", "Imperfect: <i>era, tenía, jugaba<\/i>", "Balanced opinion: <i>Lo bueno… lo malo…<\/i>"]}, {"k": "h", "t": "Speaking: describe a photo"}, {"k": "model", "t": "Model photo description", "text": "En la foto hay tres amigos. Están en un parque. A la izquierda hay una chica que lleva una camiseta roja. Están usando el móvil y parece que están contentos. Creo que son mejores amigos.", "en": "In the photo there are three friends. They are in a park. On the left there is a girl wearing a red T-shirt. They are using their phones and it looks like they are happy. I think they are best friends.", "notes": ["Who: <i>tres amigos<\/i>", "Where: <i>en un parque<\/i>", "What: <i>están usando el móvil<\/i>", "Opinion: <i>creo que…<\/i>"]}, {"k": "h", "t": "Reading aloud: the sounds of Spanish"}, {"k": "sounds", "rows": [["a, e, i, o, u", "always short and clear: ah, eh, ee, oh, oo", "Ana, pelo"], ["h", "silent: never say it", "hola, hermano"], ["j, and g before e or i", "a breathy, throaty \"h\"", "joven, gente"], ["ll", "like \"y\" in yes", "me llamo"], ["ñ", "\"ny\", as in canyon", "año, España"], ["qu", "\"k\" (the u is silent)", "quince, ¿qué?"], ["z, and c before e or i", "\"th\" in Spain (\"s\" in Latin America)", "doce, azul"], ["r / rr", "r is a quick tap; rr (and r at the start of a word) is rolled", "pero, perro, rojo"], ["v", "a soft \"b\"", "verde, vivo"], ["accent (á, é, í, ó, ú)", "say that part of the word louder", "música, inglés"]]}, {"k": "h", "t": "Listen and write"}, {"k": "p", "t": "Tap play, write what you hear, then check. Accents count!"}, {"k": "dict", "items": ["Me llevo bien con mi madre.", "Ayer subí una foto.", "Mi mejor amiga es muy graciosa.", "Cuando era pequeño, jugaba en el parque.", "Paso demasiado tiempo en internet."]}], "quiz": [{"q": "<i>Ayer subí una foto.<\/i> Which tense is <i>subí<\/i>?", "a": "Preterite (one finished action)", "w": ["Present", "Imperfect", "Near future"], "why": "<i>Ayer<\/i> + one finished action = preterite."}, {"q": "\"When I was little\" is…", "a": "Cuando era pequeño", "w": ["Cuando fui pequeño", "Cuando soy pequeño", "Cuando estaba pequeño"], "why": "Describing the past uses the imperfect: <i>era<\/i>."}, {"q": "<i>hablar<\/i>: \"I spoke\" is…", "a": "hablé", "w": ["hablo", "hablaba", "habló"], "why": "<i>habló<\/i> = he / she spoke. The accent matters!"}, {"q": "What does <i>Vi un vídeo<\/i> mean?", "a": "I watched a video", "w": ["I watch a video", "I used to watch videos", "I'm going to watch a video"], "why": "<i>vi<\/i> is the preterite of <i>ver<\/i>."}, {"q": "<i>ver<\/i>: \"I used to watch\" is…", "a": "veía", "w": ["vi", "veo", "veré"], "why": "<i>veía<\/i> is one of only three irregular imperfects."}, {"q": "Mis amigas son ___ (funny).", "a": "graciosas", "w": ["gracioso", "graciosa", "graciosos"], "why": "Girls, plural → -as."}, {"q": "What does <i>Me llevo mal con mi hermano<\/i> mean?", "a": "I get on badly with my brother", "w": ["I take my brother", "I'm ill with my brother", "My brother takes me"], "why": "<i>Llevarse bien / mal con<\/i> = to get on well / badly with."}, {"q": "Why is \"I played\" spelt <i>jugué<\/i>?", "a": "To keep the hard \"g\" sound before é", "w": ["All -ar verbs are irregular", "It's the imperfect", "It means \"we played\""], "why": "Without the u, <i>jugé<\/i> would sound like \"huh-ay\"."}, {"q": "<i>comer<\/i>: \"she ate\" is…", "a": "comió", "w": ["comí", "comía", "come"], "why": "-er / -ir preterite: él / ella → -ió."}, {"q": "What does <i>a la izquierda<\/i> mean?", "a": "On the left", "w": ["On the right", "In the middle", "In the background"], "why": "<i>A la derecha<\/i> = on the right."}, {"q": "Which sentence uses the imperfect?", "a": "Jugaba en el parque.", "w": ["Jugué en el parque.", "Juego en el parque.", "Voy a jugar en el parque."], "why": "<i>-aba<\/i> = imperfect: \"I used to play\"."}, {"q": "What is <i>el ciberacoso<\/i>?", "a": "Cyberbullying", "w": ["Cybersecurity", "Internet access", "Online shopping"], "why": "<i>Acoso<\/i> = bullying or harassment."}]}, "10": {"stage": "Edexcel GCSE · Year 10 mock", "examFacts": [["4 exams", "Listening, Reading and Grammar, plus Writing <i>or<\/i> Speaking."], ["30 minutes", "Listening, including a dictation."], ["25 minutes", "each for Reading and Grammar."], ["40 or 45 minutes", "Writing: 40 minutes at Foundation, 45 at Higher. Or Speaking: 5 minutes, with 10 minutes to prepare."], ["2 tiers", "Foundation (grades 1 to 5) or Higher (grades 4 to 9). Ask your teacher which tier you are sitting."], ["1 pen", "All you need to bring."]], "examNote": "Year 10 exams run from Monday 30 November to Friday 11 December 2026. Your teacher will tell you whether you do the Writing exam or the Speaking exam.", "tables": [{"t": "What is in each exam", "head": ["Exam", "What is in it"], "rows": [["Listening", "Comprehension questions on <b>the internet<\/b>, <b>family and friends<\/b> and <b>sports<\/b>. Then a <b>dictation<\/b>."], ["Reading", "Comprehension questions on <b>free-time activities<\/b>, <b>technology<\/b>, <b>weekend plans<\/b> and <b>social media<\/b>. Then a <b>translation into English<\/b>."], ["Writing", "Picture task (Foundation only). Open response: 80 to 90 words (Foundation) or 130 to 150 words (Higher). Translation into Spanish."], ["Grammar", "Noun, article and adjective agreement. Preterite of regular -ar, -er and -ir verbs. Present and near future (yo, tú, él / ella, nosotros). Structures + infinitive: <i>me gusta, se puede, se debe, tengo que<\/i>."], ["Speaking", "Read aloud and answer questions. Picture task and questions: describe the <b>people<\/b>, the <b>location<\/b> and the <b>activity<\/b>."]]}], "topics": [], "prepare": ["Look back through your exercise book at the tasks and questions from your lessons.", "Missed a lesson? Ask your teacher or someone in your class what you missed and catch up.", "Learn the phrases in <a href=\"#rev\">Revision<\/a> and test yourself in <a href=\"#flash\">Flashcards<\/a>.", "Practise the dictation and translations in <a href=\"#skills\">Speaking and writing<\/a> ña<\/i> to log in."}, {"q": "<i>jugar<\/i>: \"we play\" is…", "a": "jugamos", "w": ["juegamos", "juegan", "jugáis"], "why": "Stem-changers do not change in the nosotros form."}, {"q": "Which sentence uses three timeframes?", "a": "Juego al tenis, ayer jugué al fútbol y mañana voy a nadar.", "w": ["Juego al tenis y me gusta mucho.", "Ayer jugué al fútbol y gané.", "Mañana voy a nadar y voy a comer."], "why": "Present (<i>juego<\/i>), past (<i>jugué<\/i>) and future (<i>voy a nadar<\/i>)."}, {"q": "In the dictation you hear a \"ny\" sound. Which letter is it?", "a": "ñ", "w": ["n", "ll", "y"], "why": "<i>ñ<\/i> sounds like \"ny\": <i>año, España<\/i>."}, {"q": "What does <i>Me relaja<\/i> mean?", "a": "It relaxes me", "w": ["I relax", "It's relaxing for him", "I'm relaxed"], "why": "<i>Me<\/i> = me; <i>relaja<\/i> = it relaxes."}, {"q": "In the picture task, what must you describe?", "a": "People, location and activity", "w": ["Weather, clothes and colours", "Your family, school and town", "Your opinions only"], "why": "The Year 10 guide says: people, location and activity."}]}, "11": {"stage": "Edexcel GCSE · November mock", "examFacts": [["2 mock exams", "Speaking and Writing. Each is out of 50 marks."], ["2 tiers", "Foundation (grades 1 to 5) or Higher (grades 4 to 9). Check with your teacher which tier you are doing."], ["1 pen", "All you need to bring."]], "examNote": "The November mock: Speaking in individual slots, Writing on Wednesday 11 November 2026 (afternoon). Use this app to fix gaps before your GCSE.", "tables": [{"t": "Your mock papers", "head": ["", "Foundation (grades 1 to 5)", "Higher (grades 4 to 9)"], "rows": [["<b>Speaking<\/b>: 50 marks", "7 to 9 minutes", "10 to 12 minutes"], ["Task 1", "Read aloud (12 marks)", "Read aloud (12 marks)"], ["Task 2", "Role play (10 marks)", "Role play (10 marks)"], ["Task 3", "Picture task (12 marks) and conversation (16 marks)", "Picture task (12 marks) and conversation (16 marks)"], ["<b>Writing<\/b>: 50 marks",
