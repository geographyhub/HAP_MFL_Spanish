inks": [["BBC Bitesize GCSE Spanish", "https://www.bbc.co.uk/bitesize/examspecs/zwbhb7h"], ["Oak National Academy: Key Stage 4 Spanish", "https://www.thenational.academy/teachers/programmes/spanish-secondary-ks4-l/units"], ["Pearson Edexcel GCSE Spanish (specification, sample papers)", "https://qualifications.pearson.com/en/qualifications/edexcel-gcses/spanish-2024.html"]], "top": ["<b>Develop every answer:<\/b> opinion + reason + example + another timeframe.", "<b>Use all the tenses:<\/b> present, preterite, imperfect, near future and conditional (<i>me gustaría<\/i>).", "<b>Higher:<\/b> add a complex structure: <i>lo que más me gusta es…; cuando sea mayor…; estudio español desde hace…<\/i>", "<b>Answer every bullet point<\/b> in the writing tasks and keep near the word count.", "<b>Translation:<\/b> every word counts. Check tenses, agreements and accents."], "rev": [{"t": "1. My personal world", "e": "👪", "sub": "family, friends, relationships, equality", "rows": [["Me llevo muy bien con mi madre porque siempre me escucha", "I get on very well with my mum because she always listens to me"], ["Discuto con mi hermano porque es muy egoísta", "I argue with my brother because he is very selfish"], ["Un buen amigo debe ser leal y comprensivo", "A good friend should be loyal and understanding"], ["Conocí a mi mejor amiga en la escuela primaria", "I met my best friend at primary school"], ["Cuando era pequeño, pasaba mucho tiempo con mis abuelos", "When I was little, I spent lots of time with my grandparents"], ["En el futuro me gustaría casarme y tener hijos", "In the future I would like to get married and have children"], ["Creo que todos deberían tener los mismos derechos", "I think everyone should have the same rights"], ["La igualdad entre hombres y mujeres es muy importante", "Equality between men and women is very important"], ["Es injusto cuando alguien sufre discriminación", "It's unfair when someone suffers discrimination"]]}, {"t": "2. Lifestyle and wellbeing", "e": "🥗", "sub": "physical and mental wellbeing, food and drink, sports", "rows": [["Para llevar una vida sana, hay que comer fruta y verduras", "To lead a healthy life, you have to eat fruit and vegetables"], ["Hago deporte tres veces a la semana", "I do sport three times a week"], ["Ayer jugué al fútbol y después me sentí muy bien", "Yesterday I played football and afterwards I felt really good"], ["No como comida rápida porque tiene mucha grasa", "I don't eat fast food because it has lots of fat"], ["Duermo ocho horas cada noche", "I sleep eight hours every night"], ["Cuando estoy estresado, escucho música o hablo con un amigo", "When I'm stressed, I listen to music or talk to a friend"], ["La salud mental es tan importante como la salud física", "Mental health is as important as physical health"], ["Mi plato favorito es la paella porque está muy rica", "My favourite dish is paella because it's really tasty"], ["Voy a beber más agua y menos refrescos", "I'm going to drink more water and fewer fizzy drinks"]]}, {"t": "3. My neighbourhood", "e": "🏘️", "sub": "where I live, places in my area, activities and outings, shopping", "rows": [["Vivo en un barrio animado en el sureste de Londres", "I live in a lively area in south-east London"], ["En mi barrio hay muchas tiendas, pero no hay cine", "In my area there are lots of shops, but there isn't a cinema"], ["Lo que más me gusta es el parque porque es tranquilo", "What I like most is the park because it's quiet"], ["Lo malo es que hay mucho tráfico y contaminación", "The bad thing is that there's lots of traffic and pollution"], ["El sábado pasado fui de compras al centro comercial", "Last Saturday I went shopping at the shopping centre"], ["Compré una camiseta, pero era demasiado grande", "I bought a T-shirt, but it was too big"], ["Se puede ir al cine o comer en un restaurante", "You can go to the cinema or eat in a restaurant"], ["Si tengo dinero, voy a construir un polideportivo", "If I have money, I'm going to build a sports centre"], ["Para proteger el medio ambiente, hay que reciclar", "To protect the environment, you have to recycle"]]}, {"t": "4. Media and technology", "e": "📱", "sub": "social media and gaming, hobbies, music, TV and film", "rows": [["Uso las redes sociales para estar en contacto con mis amigos", "I use social media to stay in touch with my friends"], ["Paso demasiado tiempo en el móvil", "I spend too much time on my phone"], ["Me encantan los videojuegos, pero mis padres dicen que son una pérdida de tiempo", "I love video games, but my parents say they're a waste of time"], ["Anoche vi una película de acción en el cine", "Last night I saw an action film at the cinema"], ["Mi tipo de música preferido es el rap", "My favourite type of music is rap"], ["Es importante no compartir datos personales en línea", "It's important not to share personal data online"], ["Antes veía mucho la tele, pero ahora prefiero las series en línea", "I used to watch a lot of TV, but now I prefer online series"], ["Mañana voy a descargar una nueva aplicación", "Tomorrow I'm going to download a new app"]]}, {"t": "5. Studying and my future", "e": "🎓", "sub": "school, future studies and jobs", "rows": [["Mi asignatura favorita es la historia porque el profesor es muy divertido", "My favourite subject is history because the teacher is really fun"], ["Las clases empiezan a las ocho y media", "Lessons start at half past eight"], ["En mi instituto hay que llevar uniforme", "In my school you have to wear a uniform"], ["El año pasado saqué buenas notas en ciencias", "Last year I got good marks in science"], ["Después de mis exámenes, voy a seguir estudiando", "After my exams, I'm going to carry on studying"], ["Me gustaría ser médico porque quiero ayudar a la gente", "I would like to be a doctor because I want to help people"], ["Hablar otro idioma es útil para encontrar trabajo", "Speaking another language is useful for finding a job"], ["Cuando sea mayor, quiero viajar por el mundo", "When I'm older, I want to travel the world (Higher)"]]}, {"t": "6. Travel and tourism", "e": "✈️", "sub": "tourist attractions, accommodation, transport, shopping", "rows": [["Normalmente voy de vacaciones a España con mi familia", "Normally I go on holiday to Spain with my family"], ["El verano pasado fuimos a la playa en avión", "Last summer we went to the beach by plane"], ["Nos alojamos en un hotel de cinco estrellas", "We stayed in a five-star hotel"], ["Visité muchos monumentos y saqué muchas fotos", "I visited lots of monuments and took lots of photos"], ["Hacía calor y el cielo estaba despejado", "It was hot and the sky was clear"], ["Prefiero viajar en tren porque es más cómodo", "I prefer travelling by train because it's more comfortable"], ["El año que viene voy a ir a México", "Next year I'm going to go to Mexico"], ["Me gustaría alojarme en un camping cerca del mar", "I would like to stay at a campsite near the sea"], ["Quisiera reservar una habitación doble, por favor", "I would like to book a double room, please"]]}], "cards": [{"t": "1. My personal world", "e": "👪", "rows": [["la pareja", "partner / couple"], ["los padres", "parents"], ["el novio / la novia", "boyfriend / girlfriend"], ["casarse", "to get married"], ["la igualdad", "equality"], ["los derechos", "rights"], ["apoyar", "to support"], ["confiar en", "to trust"]]}, {"t": "2. Lifestyle and wellbeing", "e": "🥗", "rows": [["sano / sana", "healthy"], ["la comida basura", "junk food"], ["el sueño", "sleep"], ["estresado / estresada", "stressed"], ["el ejercicio", "exercise"], ["la salud", "health"], ["en forma", "fit"], ["beber", "to drink"]]}, {"t": "3. My neighbourhood", "e": "🏘️", "rows": [["el barrio", "neighbourhood"], ["la tienda", "shop"], ["la ropa", "clothes"], ["el medio ambiente", "the environment"], ["la basura", "rubbish"], ["reciclar", "to recycle"], ["ruidoso / ruidosa", "noisy"], ["barato / barata", "cheap"]]}, {"t": "4. Media and technology", "e": "📱", "rows": [["las redes sociales", "social media"], ["el móvil", "mobile phone"], ["descargar", "to download"], ["la pantalla", "screen"], ["los videojuegos", "video games"], ["la película", "film"], ["compartir", "to share"], ["la aplicación", "app"]]}, {"t": "5. Studying and my future", "e": "🎓", "rows": [["la asignatura", "school subject"], ["el instituto", "secondary school"], ["las notas", "marks / grades"], ["el trabajo", "job / work"], ["el idioma", "language"], ["aprobar", "to pass (an exam)"], ["el uniforme", "uniform"], ["la universidad", "university"]]}, {"t": "6. Travel and tourism", "e": "✈️", "rows": [["el alojamiento", "accommodation"], ["alojarse", "to stay (in a hotel)"], ["el viaje", "journey / trip"], ["el billete", "ticket"], ["el extranjero", "abroad"], ["reservar", "to book"], ["el recuerdo", "souvenir"], ["la habitación", "room"]]}], "gram": [{"t": "Present tense", "p": "What you normally do. Know your key irregulars.", "table": {"head": ["", "ser", "tener", "ir", "hacer"], "rows": [["yo", "soy", "tengo", "voy", "hago"], ["tú", "eres", "tienes", "vas", "haces"], ["él / ella", "es", "tiene", "va", "hace"], ["nosotros", "somos", "tenemos", "vamos", "hacemos"], ["ellos", "son", "tienen", "van", "hacen"]]}}, {"t": "Preterite: what you did", "p": "One finished action. Regular endings: -ar <i>-é, -aste, -ó, -amos, -asteis, -aron<\/i>; -er / -ir <i>-í, -iste, -ió, -imos, -isteis, -ieron<\/i>.", "table": {"head": ["Infinitive", "I…", "we…"], "rows": [["ir / ser", "fui", "fuimos"], ["hacer", "hice", "hicimos"], ["tener", "tuve", "tuvimos"], ["estar", "estuve", "estuvimos"], ["poder", "pude", "pudimos"], ["ver", "vi", "vimos"]]}, "ex": [["El verano pasado fuimos a Barcelona.", "Last summer we went to Barcelona."]]}, {"t": "Imperfect: used to / was", "p": "-ar: <i>-aba<\/i>; -er / -ir: <i>-ía<\/i>. Irregular: <i>era, iba, veía<\/i>. Foundation needs the singular forms (I, you, he / she); Higher needs them all.", "ex": [["Cuando era pequeño, jugaba al fútbol.", "When I was little, I used to play football."], ["Hacía calor.", "It was hot."]]}, {"t": "Future", "p": "Near future: <i>voy a<\/i> + infinitive. Simple future: infinitive + <i>-é, -ás, -á, -emos, -éis, -án<\/i>. Foundation needs the singular forms; Higher needs them all.", "table": {"head": ["Infinitive", "I will…"], "rows": [["viajar", "viajaré"], ["tener", "tendré"], ["hacer", "haré"], ["poder", "podré"], ["salir", "saldré"]]}, "ex": [["En el futuro viajaré por el mundo.", "In the future I will travel the world."]]}, {"t": "Conditional: would", "p": "Infinitive + <i>-ía, -ías, -ía, -íamos, -íais, -ían<\/i>. Same irregular stems as the future. Foundation needs the singular forms; Higher needs them all.", "ex": [["Me gustaría ser profesor.", "I would like to be a teacher."], ["Sería genial.", "It would be great."], ["Tendría más tiempo libre.", "I would have more free time."]]}, {"t": "Perfect: have done", "p": "<i>he, has, ha, hemos, habéis, han<\/i> + past participle (-ado / -ido).", "ex": [["He visitado Madrid dos veces.", "I have visited Madrid twice."], ["Nunca he comido sushi.", "I have never eaten sushi."]], "tip": "Irregular participles: <i>hecho<\/i> (done), <i>visto<\/i> (seen), <i>escrito<\/i> (written), <i>puesto<\/i> (put)."}, {"t": "Higher: structures to impress", "p": "Pearson only asks for a few verbs in the present subjunctive at Higher, in the singular. The imperfect subjunctive (<i>si tuviera…<\/i>) and the pluperfect are <b>not<\/b> needed. These four are worth learning.", "table": {"head": ["Structure", "Example", "English"], "rows": [["cuando + subjunctive", "Cuando <b>sea<\/b> mayor, seré médico.", "When I'm older, I'll be a doctor."], ["desde hace + present", "Estudio español <b>desde hace<\/b> cuatro años.", "I have been studying Spanish for four years."], ["se + verb", "<b>Se venden<\/b> recuerdos en la tienda.", "Souvenirs are sold in the shop."], ["passive with por", "La Sagrada Familia <b>fue diseñada por<\/b> Gaudí.", "The Sagrada Familia was designed by Gaudí."]]}}], "skills": [{"k": "h", "t": "Speaking: 15 minutes to prepare, then three tasks"}, {"k": "p", "t": "You get 15 minutes to prepare, with one A4 sheet for notes. No dictionary."}, {"k": "h3", "t": "Task 1: Read aloud (12 marks)"}, {"k": "p", "t": "Read a short text (Foundation 35 to 40 words; Higher 50 to 55 words), then answer two questions in the present tense about your likes, dislikes or opinions."}, {"k": "model", "t": "Practise reading this aloud", "text": "Me gusta mucho mi barrio. Hay un parque grande y muchas tiendas. Los sábados voy al centro con mis amigos. Normalmente comemos en un restaurante pequeño. Mi hermana prefiere ir al cine.", "en": "I really like my area. There is a big park and lots of shops. On Saturdays I go into town with my friends. We normally eat in a small restaurant. My sister prefers going to the cinema."}, {"k": "model", "t": "Then answer the questions", "text": "¿Te gusta tu barrio? Sí, me gusta mi barrio porque es animado y hay mucho que hacer. ¿Qué haces los fines de semana? Los fines de semana hago deporte y quedo con mis amigos en el centro.", "en": "Do you like your area? Yes, I like my area because it's lively and there's lots to do. What do you do at weekends? At weekends I do sport and meet my friends in town."}, {"k": "h3", "t": "Task 2: Role play (10 marks)"}, {"k": "p", "t": "Five bullet points. Foundation: you ask one question (marked ?). Higher: you ask two questions, and one answer needs the future."}, {"k": "table", "head": ["Bullet", "You say"], "rows": [["Setting: you are at a hotel in Spain.", ""], ["Say how many nights", "Quiero una habitación para tres noches."], ["Say what type of room", "Una habitación doble, por favor."], ["Say what you want to do in town", "Quiero visitar el museo."], ["? Ask the price", "¿Cuánto cuesta?"], ["Say what you will do tomorrow (Higher)", "Mañana voy a ir a la playa."]]}, {"k": "h3", "t": "Task 3: Picture task (12 marks) and conversation (16 marks)"}, {"k": "p", "t": "Describe the picture: <b>people, location, activity<\/b>. Then two questions: Foundation both in the present; Higher one present, one past. Then a conversation on your chosen theme."}, {"k": "model", "t": "Model picture description (Higher)", "text": "En la foto hay una familia en un parque. A la izquierda hay un hombre que lleva una camiseta azul y a la derecha hay dos niños que están jugando al fútbol. Hace sol y parece que todos están contentos. Creo que es fin de semana porque están relajados.", "en": "In the photo there is a family in a park. On the left there is a man wearing a blue T-shirt and on the right there are two children playing football. It's sunny and it looks like they are all happy. I think it's the weekend because they are relaxed."}, {"k": "model", "t": "Model answers to the two questions", "text": "¿Te gusta hacer deporte con tu familia? Sí, me encanta porque es divertido y nos mantiene en forma. ¿Qué hiciste el fin de semana pasado? El sábado pasado fui al parque con mis primos y jugamos al baloncesto. Después comimos pizza.", "en": "Do you like doing sport with your family? Yes, I love it because it's fun and it keeps us fit. What did you do last weekend? Last Saturday I went to the park with my cousins and we played basketball. Afterwards we ate pizza."}, {"k": "steps", "items": ["<b>Conversation:<\/b> give long answers. Opinion + reason + example + a different tense.", "Use phrases that buy thinking time: <i>Pues…, A ver…, Es una buena pregunta.<\/i>", "If you don't understand, ask: <i>¿Puede repetir, por favor?<\/i>"]}, {"k": "h", "t": "Writing"}, {"k": "model", "t": "Foundation 40 to 50 words: formal email to a hotel", "text": "Estimado señor: Quisiera reservar una habitación doble para dos noches en agosto. Me gustaría una habitación con vistas al mar. ¿Hay piscina en el hotel? ¿Cuánto cuesta el desayuno? Vamos a llegar el día cinco. Atentamente, Sam Smith", "en": "Dear Sir, I would like to book a double room for two nights in August. I would like a room with a sea view. Is there a pool at the hotel? How much is breakfast? We are going to arrive on the fifth. Yours faithfully, Sam Smith"}, {"k": "model", "t": "Foundation and Higher 80 to 90 words: email to a friend", "text": "¡Hola Marta! El verano pasado fui a Barcelona con mi familia. Nos alojamos en un hotel cerca de la playa. Visitamos la Sagrada Familia y comimos paella en un restaurante. ¡Fue fantástico! Normalmente prefiero ir de vacaciones a la playa porque me encanta nadar y tomar el sol. El año que viene voy a ir a Francia en tren con mis amigos. Me gustaría visitar París porque quiero ver la torre Eiffel. ¿Y tú? ¿Adónde vas a ir? Un abrazo, Sam", "en": "Hi Marta! Last summer I went to Barcelona with my family. We stayed in a hotel near the beach. We visited the Sagrada Familia and ate paella in a restaurant. It was fantastic! I normally prefer going to the beach on holiday because I love swimming and sunbathing. Next year I'm going to go to France by train with my friends. I'd like to visit Paris because I want to see the Eiffel Tower. And you? Where are you going to go? Love, Sam", "notes": ["Preterite: <i>fui, nos alojamos, visitamos<\/i>", "Present opinion + reason", "Near future and conditional", "A question back to the reader"]}, {"k": "model", "t": "Higher 130 to 150 words: article on healthy living", "text": "La salud es muy importante para los jóvenes de hoy. En mi opinión, para llevar una vida sana hay que comer bien, dormir ocho horas y hacer ejercicio con regularidad. Personalmente, juego al baloncesto dos veces a la semana y voy al instituto andando. Sin embargo, no siempre ha sido así. Cuando era más pequeño, comía mucha comida basura y pasaba horas delante de la pantalla. El año pasado decidí cambiar mis hábitos: empecé a beber más agua y dejé los refrescos. Me sentí mucho mejor y tenía más energía en clase. Además, la salud mental es tan importante como la salud física. Por eso, intento hablar con mis amigos cuando estoy estresado. En el futuro, me gustaría correr una media maratón. Si todos hacemos pequeños cambios, la sociedad será más sana.", "en": "Health is very important for young people today. In my opinion, to lead a healthy life you have to eat well, sleep eight hours and exercise regularly. Personally, I play basketball twice a week and I walk to school. However, it hasn't always been like this. When I was younger, I used to eat lots of junk food and spend hours in front of a screen. Last year I decided to change my habits: I started drinking more water and gave up fizzy drinks. I felt much better and had more energy in class. Also, mental health is as important as physical health. That's why I try to talk to my friends when I'm stressed. In the future I'd like to run a half marathon. If we all make small changes, society will be healthier.", "notes": ["Perfect: <i>ha sido<\/i>", "Imperfect and preterite side by side", "Comparison: <i>tan importante como<\/i>", "Conditional, future and a <i>si<\/i> clause"]}, {"k": "h", "t": "Translation practice: English into Spanish"}, {"k": "trans", "items": [["I get on well with my parents.", "Me llevo bien con mis padres."], ["Last summer we went to Spain by plane.", "El verano pasado fuimos a España en avión."], ["When I was younger, I used to play football every day.", "Cuando era más joven, jugaba al fútbol todos los días."], ["In the future I would like to be a doctor.", "En el futuro me gustaría ser médico."], ["It is important to eat healthily.", "Es importante comer sano."]]}, {"k": "h", "t": "Dictation: the sounds of Spanish"}, {"k": "p", "t": "Section B of the Listening paper is a dictation. Learn these sound-spelling rules, then practise."}, {"k": "sounds", "rows": [["a, e, i, o, u", "always short and clear: ah, eh, ee, oh, oo", "Ana, pelo"], ["h", "silent: never say it", "hola, hermano"], ["j, and g before e or i", "a breathy, throaty \"h\"", "joven, gente"], ["ll", "like \"y\" in yes", "me llamo"], ["ñ", "\"ny\", as in canyon", "año, España"], ["qu", "\"k\" (the u is silent)", "quince, ¿qué?"], ["z, and c before e or i", "\"th\" in Spain (\"s\" in Latin America)", "doce, azul"], ["r / rr", "r is a quick tap; rr (and r at the start of a word) is rolled", "pero, perro, rojo"], ["v", "a soft \"b\"", "verde, vivo"], ["accent (á, é, í, ó, ú)", "say that part of the word louder", "música, inglés"]]}, {"k": "dict", "items": ["Me gusta ir al cine con mis amigos.", "El año pasado fuimos a la playa.", "Hay que reciclar el plástico.", "Mi hermano quiere ser periodista.", "La comida española es muy rica."]}], "quiz": [{"q": "Which tense is <i>fuimos<\/i> in <i>El verano pasado fuimos a la playa<\/i>?", "a": "Preterite", "w": ["Imperfect", "Present", "Conditional"], "why": "<i>fuimos<\/i> = we went (ir) or we were (ser)."}, {"q": "\"I would like to be a doctor\" is…", "a": "Me gustaría ser médico.", "w": ["Me gusta ser médico.", "Me gustó ser médico.", "Voy a ser médico."], "why": "<i>gustaría<\/i> = would like (conditional)."}, {"q": "<i>Cuando sea mayor…<\/i> Why <i>sea<\/i>, not <i>soy<\/i>?", "a": "<i>Cuando<\/i> about the future takes the subjunctive", "w": ["It's the past tense", "It's the conditional", "It's a spelling mistake"], "why": "A Higher structure worth learning by heart."}, {"q": "\"I have visited\" is…", "a": "he visitado", "w": ["visité", "visitaba", "visitaré"], "why": "Perfect: <i>he<\/i> + participle."}, {"q": "What does <i>Nos alojamos en un hotel<\/i> mean?", "a": "We stayed in a hotel", "w": ["We booked a hotel", "We left the hotel", "We liked the hotel"], "why": "<i>Alojarse<\/i> = to stay (accommodation)."}, {"q": "<i>hacer<\/i> in the future: \"I will do\" is…", "a": "haré", "w": ["haceré", "hago", "hice"], "why": "Irregular future stem: <i>har-<\/i>."}, {"q": "Which phrase means \"What I like most is…\"?", "a": "Lo que más me gusta es…", "w": ["Lo bueno es que…", "Me gustaría…", "Me gusta más que…"], "why": "A great complex structure for speaking and writing."}, {"q": " a and Jorge are talking about the environment. Put a cross in the correct box for each question.", "audio": ["Me llamo Carlos. En mi barrio hay mucha basura en la calle. Es horrible.", "Soy Elena. Yo siempre reciclo el plástico y el papel en casa.", "Me llamo Jorge. En mi ciudad hay demasiados coches, por eso voy al instituto en bicicleta."], "en": "Carlos: My name is Carlos. In my area there is a lot of rubbish in the street. It's horrible. Elena: I'm Elena. I always recycle plastic and paper at home. Jorge: My name is Jorge. In my city there are too many cars, so I go to school by bike.", "qs": [{"k": "mcq", "q": "(a) Carlos says there is a lot of …", "o": ["rubbish.", "traffic.", "noise."], "a": 0}, {"k": "mcq", "q": "(b) Elena always recycles …", "o": ["glass and cans.", "plastic and paper.", "clothes."], "a": 1}, {"k": "mcq", "q": "(c) Jorge goes to school by …", "o": ["bus.", "car.", "bike."], "a": 2}]}, {"sec": "listen", "tier": "F", "t": "My phone", "intro": "Lucía is talking about how she uses her phone. Which three things does she do? Choose three.", "audio": ["Uso mi móvil todos los días. Por la mañana escucho música en el autobús. En el recreo mando mensajes a mis amigos. Por la noche veo vídeos de cocina, pero nunca juego a los videojuegos porque no me gustan."], "en": "I use my phone every day. In the morning I listen to music on the bus. At break I send messages to my friends. At night I watch cooking videos, but I never play video games because I don't like them.", "qs": [{"k": "multi", "q": "What does Lucía do on her phone?", "o": ["listens to music", "plays video games", "sends messages", "takes photos", "watches cooking videos", "reads the news"], "a": [0, 2, 4]}]}, {"sec": "listen", "tier": "H", "t": "Sport and health", "intro": "Carmen is talking about sport. Answer the questions in English.", "audio": ["Desde hace dos años juego al baloncesto en un equipo del barrio. Antes no hacía nada de deporte y pasaba horas delante de la pantalla. Ahora me siento mucho mejor y duermo bien. El mes pasado me hice daño en la pierna, así que no pude jugar durante tres semanas. Fue muy frustrante. El año que viene me gustaría ser capitana del equipo."], "en": "I have been playing basketball in a local team for two years. Before, I didn't do any sport and I spent hours in front of a screen. Now I feel much better and I sleep well. Last month I hurt my leg, so I couldn't play for three weeks. It was very frustrating. Next year I would like to be the team captain.", "qs": [{"k": "short", "q": "(a) How long has Carmen played basketball?", "a": "Two years."}, {"k": "short", "q": "(b) What did she do before? Give one detail.", "a": "She did no sport, or she spent hours in front of a screen."}, {"k": "short", "q": "(c) Give one benefit of sport she mentions.", "a": "She feels much better, or she sleeps well."}, {"k": "short", "q": "(d) Why couldn't she play last month?", "a": "She hurt her leg."}, {"k": "short", "q": "(e) What would she like to do next year?", "a": "Be the team captain."}]}, {"sec": "listen", "tier": "H", "t": "Holidays", "intro": "Pablo is talking about holidays. Put a cross in the correct box for each question.", "audio": ["El verano pasado fuimos a un camping en el norte de España. Lo mejor fue el paisaje, pero llovió casi todos los días. Este año prefiero quedarme en casa con mis amigos, porque viajar es muy caro."], "en": "Last summer we went to a campsite in the north of Spain. The best thing was the scenery, but it rained almost every day. This year I prefer to stay at home with my friends, because travelling is very expensive.", "qs": [{"k": "mcq", "q": "(a) Last summer Pablo stayed in …", "o": ["a hotel.", "a campsite.", "a friend's house."], "a": 1}, {"k": "mcq", "q": "(b) The problem was …", "o": ["the weather.", "the food.", "the journey."], "a": 0}, {"k": "mcq", "q": "(c) This year he prefers to stay at home because …", "o": ["his friends are away.", "he has exams.", "travelling is expensive."], "a": 2}]}, {"sec": "read", "tier": "F", "t": "Marta's weekend", "intro": "Read what Marta says. Put a cross in the correct box for each question.", "text": "¡Hola! Me llamo Marta y vivo en Valencia. Los sábados por la mañana voy al mercado con mi abuela. Por la tarde quedo con mis amigos en el parque. Los domingos hago mis deberes y por la noche veo una serie con mi familia. El fin de semana que viene voy a ir a la playa porque va a hacer calor.", "qs": [{"k": "mcq", "q": "(a) On Saturday mornings Marta goes to the …", "o": ["market.", "cinema.", "sports centre."], "a": 0}, {"k": "mcq", "q": "(b) On Saturday afternoons she …", "o": ["does her homework.", "meets friends in the park.", "visits her grandmother."], "a": 1}, {"k": "mcq", "q": "(c) On Sunday evenings she …", "o": ["goes to bed early.", "plays video games.", "watches a series with her family."], "a": 2}, {"k": "mcq", "q": "(d) Next weekend she is going to the beach because …", "o": ["it's her birthday.", "it is going to be hot.", "her cousins are there."], "a": 1}]}, {"sec": "read", "tier": "F", "t": "My school", "intro": "Read the text. Complete each sentence with a word from the box. There are more words than gaps.", "text": "Mi instituto es grande y moderno. Mi asignatura favorita es el dibujo porque el profesor es muy divertido. No me gustan las matemáticas porque son difíciles. Llevo uniforme, pero no me molesta. A la hora de comer, como en la cantina con mis amigos.", "qs": [{"k": "gaps", "q": "Complete the sentences.", "box": ["art", "difficult", "canteen", "music", "boring", "park"], "items": [["(a) Their favourite subject is", "art"], ["(b) They find maths", "difficult"], ["(c) At lunchtime they eat in the", "canteen"]]}]}, {"sec": "read", "tier": "H", "t": "Young people and social media", "intro": "Read the article. Answer the questions in English.", "text": "Mucha gente piensa que los jóvenes pasan demasiado tiempo en las redes sociales. Según una encuesta reciente, el setenta por ciento de los adolescentes españoles usa el móvil más de tres horas al día. Para algunos, las redes son una forma de expresarse y conocer a personas con los mismos intereses. Sin embargo, otros dicen que se sienten tristes cuando comparan su vida con la de los demás. Los expertos recomiendan apagar el móvil una hora antes de dormir.", "qs": [{"k": "short", "q": "(a) What percentage of Spanish teenagers use their phone for more than three hours a day?", "a": "70%."}, {"k": "short", "q": "(b) Give one positive thing about social media mentioned.", "a": "A way to express yourself, or to meet people with the same interests."}, {"k": "short", "q": "(c) Why do some young people feel sad?", "a": "They compare their life with other people's."}, {"k": "short", "q": "(d) What do experts recommend?", "a": "Switching off your phone an hour before going to sleep."}]}, {"sec": "trans", "tier": "F", "t": "Translate into English: five sentences", "intro": "Write your English, then tap each one to check.", "items": [["Tengo un hermano mayor.", "I have an older brother."], ["Me gusta ir al cine los viernes.", "I like going to the cinema on Fridays."], ["Mi madre trabaja en un hospital.", "My mum works in a hospital."], ["Ayer comí pescado con mi familia.", "Yesterday I ate fish with my family."], ["Mañana voy a visitar a mis abuelos.", "Tomorrow I'm going to visit my grandparents."]]}, {"sec": "trans", "tier": "H", "t": "Translate into English: a short paragraph", "intro": "Write your English, then tap to check.", "items": [["Cuando era pequeña, vivía en un pueblo cerca de la montaña. Me encantaba jugar en el río con mis primos. Hace tres años mi familia se mudó a Madrid porque mi padre encontró trabajo allí. Ahora tengo más oportunidades, pero echo de menos la naturaleza.", "When I was little, I lived in a village near the mountains. I loved playing in the river with my cousins. Three years ago my family moved to Madrid because my dad found work there. Now I have more opportunities, but I miss nature."]]}], "marking": [["Listening and Reading", "You answer in English. There are <b>no marks for the quality of your English<\/b>, so keep answers short and clear. Answer exactly what is asked: if it says choose three, choose three. In the Listening paper you hear each recording three times."], ["Dictation", "You write down Spanish sentences you hear. Some spellings that sound exactly the same can still get the mark (for example <i>b<\/i> written as <i>v<\/i>), but aim for the exact spelling."], ["Writing: open questions", "Two marks for each answer. <b>1. Answering the task:<\/b> cover the bullet points, add an extra detail to each, and be easy to understand. <b>2. Your language:<\/b> a variety of words and grammar, longer sentences (with <i>because<\/i>, <i>when<\/i>, or two verbs together), three timeframes (past, present, future) and accuracy."], ["Minor and major errors", "A <b>minor<\/b> error does not stop the meaning: a missing accent, the wrong gender, a wrong adjective ending. A <b>major<\/b> error does: a wrongly formed verb, the wrong tense, a made-up word. Check your verbs first."], ["Speaking: read aloud", "Marked on <b>pronunciation<\/b>. The examiner listens without looking at the text, so every sound must be clear. English-sounding versions of look-alike words lose marks."], ["Speaking: picture task and conversation", "Answer each question in a full sentence, then develop it: opinion, reason, example, and a different timeframe. One-word answers can only get one mark."]], "official": "https://qualifications.pearson.com/en/qualifications/edexcel-gcses/spanish-2024.html"}, "gloss": {"7": [["Greetings and feelings", "hola", "hello", "hello"], ["Greetings and feelings", "adiós", "goodbye", "goodbye"], ["Greetings and feelings", "buenos días", "good morning", "good_morning"], ["Greetings and feelings", "¿qué tal?", "how are you?", "how_are_you"], ["Greetings and feelings", "bien", "well, fine", "fine"], ["Greetings and feelings", "fatal", "awful, bad", "a  var dueList=function(){var t=ltToday();var d=cards.filter(function(c){return ltDue(S.cards[c[0]],t);});var seen1=d.filter(function(c){return S.cards[c[0]]&&S.cards[c[0]].b===1;}),fresh=d.filter(function(c){return !S.cards[c[0]];}),later=d.filter(function(c){return S.cards[c[0]]&&S.cards[c[0]].b>1;});return shuffle(seen1).concat(shuffle(later),fresh).slice(0,LT_MAX);};
 var home=function(){document.body.classList.remove('running');
  var due=dueList(),box1=cards.filter(function(c){return boxOf(c[0])===1;}),fresh=cards.filter(function(c){return !S.cards[c[0]];}).length;

 var run=function(list){document.body.classList.add('running');var i=0,right=0,up=0,down=0,xp=0,missed=[];

   return '<h3>'+n+'</h3><div class="pgx">'+its.map(function(r){var ic=D.icons[r[3]];return '<div>'+(ic?'<span class="hi-i"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">'+ic+'</svg></span>':'<span></span>')+'<p style="margin:0"><b class="pgw">'+r[1]+'</b><span class="pge">'+r[2]+'</span>'+sayBtn(r[1])+'</p></div>';}).join('')+'</div>';}).join('');
  document.getElementById('pgl').innerHTML=html||'<p class="lead">No matches.</p>';
  [].forEach.call(document.querySelectorAll('#pgsets button'),function(b){b.onclick=function(){PG.set=b.dataset.s;draw();};});}
 var tm;document.getElementById('pgq').oninput=function(){var v=this.value;clearTimeout(tm);tm=setTimeout(function(){PG.q=v.trim();draw();},150);};
 draw();
}

var p=parse();go(p.y,p.t,true);
})();
